name: Deploy
on:
    push:
        branches:
            - main
permissions:
    contents: read
    packages: write
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Cache
              uses: Swatinem/rust-cache@v2.9.2
            - name: Build Binary
              run: cargo build --release
    deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Setup SSH
              uses: webfactory/ssh-agent@v0.9.0
              with:
                  ssh-private-key: ${{secrets.VPS_SSH_KEY}}
            - name: Setup SSH Host Key
              run: |
                  mkdir -p ~/.ssh
                  ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
            - name: Copy Binary
              run: scp target/release/universe ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:universe/universe
