[package]
name = "universe"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = "0.6.10"
actix-multipart = "0.8.0"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = { version = "4.14.0", features = ["rustls-0_23"] }
aes-gcm = "0.11.0"
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.4", features = ["derive"] }
derive_more = "2.1.1"
dotenv = "0.15.0"
enum-display = "0.2.1"
env_logger = "0.11.11"
envy = "0.4.2"
hex = "0.4.3"
image = "0.25.10"
log = "0.4.33"
maud = { version = "0.27.0", features = ["actix-web"] }
mime = "0.3.17"
mime_guess = "2.0.5"
minijinja = { version = "2.21.0", features = ["loop_controls"] }
oauth2 = "5.0.0"
reqwest = { version = "0.13.4", features = ["json"] }
rust-embed = { version = "8.12.0", features = ["actix-web", "compression"] }
rustls = "0.23.42"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "chrono", "sqlite"] }
strum = { version = "0.28.0", features = ["strum_macros"] }
strum_macros = "0.28.0"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v7"] }
