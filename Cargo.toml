[package]
name = "universe"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.0"
anyhow = "1.0.104"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie-private"] }
chrono = "0.4.45"
clap = { version = "4.6.4", features = ["derive"] }
dotenv = "0.15.0"
envy = "0.4.2"
hex = "0.4.3"
oauth2 = "5.0.0"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "chrono", "sqlite"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
